<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#244e41"><meta name="description" content="依照自己的記憶節奏複習英文單字，累積看得見的學習進步。"><title>Wordgrove｜單字記憶花園</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><aside class="sidebar"><a class="brand" href="#overview"><span class="brand-icon">❧</span><span>wordgrove<small>單字記憶花園</small></span></a><div class="nav-label">你的學習空間</div><nav aria-label="主要導覽"><button data-page="overview" class="active"><span>◫</span>學習總覽</button><button data-page="review"><span>▱</span>今日複習<i id="navDue">0</i></button><button data-page="library"><span>▤</span>我的單字庫</button><button data-page="progress"><span>↗</span>學習足跡</button></nav><div class="sidebar-note"><span class="sprout">♧</span><strong>每天一點，記得更久。</strong><p>讓每個單字，都有時間在記憶裡扎根。</p><div class="little-line"></div></div><div class="local-label"><span class="status-dot"></span> 進度保存在這個瀏覽器</div><button class="export-side" id="exportSide">↥ 匯出學習備份</button></aside><main><header><span id="breadcrumb">你的學習空間 / 學習總覽</span><div><span class="date" id="todayDate"></span><span class="avatar">我</span></div></header><div class="content"><section id="overview" class="page active"></section><section id="review" class="page"></section><section id="library" class="page"></section><section id="progress" class="page"></section></div><footer>WORDGROVE <span>讓記憶慢慢生長</span></footer></main></div>
<dialog id="wordDialog"><form id="wordForm"><div class="dialog-head"><div><span class="eyebrow">PLANT A NEW WORD</span><h2>種下一個新單字</h2></div><button type="button" class="icon-btn" id="closeDialog" aria-label="關閉">×</button></div><label>英文單字<input id="wordInput" required maxlength="80" placeholder="例如：serendipity" autocomplete="off"></label><label>中文意思<input id="meaningInput" required maxlength="180" placeholder="例如：意外發現美好事物的機緣"></label><label>例句 <span class="muted">（選填）</span><textarea id="exampleInput" maxlength="400" placeholder="用一句話，把單字放進生活。"></textarea></label><p id="formError" role="alert"></p><button class="primary" type="submit">＋ 加入單字庫</button></form></dialog><input type="file" accept="application/json,.json" id="importFile" hidden><div id="toast" role="status"></div><script src="app.js"></script></body></html>
